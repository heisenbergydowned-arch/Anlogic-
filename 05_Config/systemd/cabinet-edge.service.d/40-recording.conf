[Service]
EnvironmentFile=/etc/cabinet/web.env
ExecStart=
ExecStart=/usr/bin/python3 /opt/cabinet/linux/run_edge.py --live --local-display --config /etc/cabinet/edge.json --learning-config /etc/cabinet/learning.json --learning-db /var/lib/cabinet/baselines.sqlite3 --host 0.0.0.0 --port 8766 --capture-dir /var/lib/cabinet/captures --capture-contract /etc/cabinet/capture-contract.json --commissioning-dir /var/lib/cabinet/commissioning-workbench
