<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>机柜风冷测控</title><style>
body{font:16px system-ui,sans-serif;background:#f5f6f7;color:#222;max-width:960px;margin:32px auto;padding:0 20px}h1{font-size:24px}h2{font-size:18px;margin-top:28px}#health{padding:12px;background:#fff;border-left:4px solid #888}#health[data-level="3"]{border-color:#c33}#health[data-level="2"]{border-color:#d90}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;padding:16px}.value{font-size:26px;margin:6px 0}.muted{color:#666;font-size:13px}button{padding:5px 10px}#events td{font-size:14px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style><h1>机柜风冷测控</h1><div id="health">连接中</div><p id="stamp" class="muted"></p><div class="grid" id="cards"></div>
<h2>诊断与实际动作</h2><table id="details"></table><h2>报警记录（最近 20 条）</h2><table><thead><tr><th>原因</th><th>级别 / 状态</th><th>来源</th><th>确认</th></tr></thead><tbody id="events"></tbody></table>
<p class="muted">确认只标记已查看。保护复位和消音在本地操作；本系统不控制供电切断；PWM禁止不等于断电。</p>
<p><a href="/recording">故障样本录制与下载</a> · <a href="/history">历史曲线、故障原始波形回放与导出</a> · <a href="/parameters">受控参数配置</a> · <a href="/pressure-calibration">压差健康标定</a> · <a href="/diagnostics">ICM 通信诊断</a></p>
<label>授权令牌 <input id="token" type="password" autocomplete="off" placeholder="仅本页内存，不保存"></label>
<script>
const el=id=>document.getElementById(id);const text=(tag,value)=>{let n=document.createElement(tag);n.textContent=String(value??'—');return n};
function row(name,value){let tr=document.createElement('tr');tr.append(text('td',name),text('td',value));return tr}
const authHeaders=()=>el('token').value?{Authorization:'Bearer '+el('token').value}:{};
let refreshing=false;
async function refresh(){if(refreshing)return;refreshing=true;let abort=new AbortController(),timer=setTimeout(()=>abort.abort(),2000);try{let get=async url=>{let r=await fetch(url,{signal:abort.signal,cache:'no-store',headers:authHeaders()});if(!r.ok)throw Error('HTTP '+r.status);return r.json()};let [s,events]=await Promise.all([get('/api/status'),get('/api/events')]);
let p=s.status||{},frame=s.frame||{},v=frame.values||{},online=s.link==='ONLINE',fresh=s.frame_age_ms!=null&&s.frame_age_ms<=1000,uncal=(frame.quality&4096)!==0;el('health').textContent=(s.test?'联调测试 · ':'')+(online?'设备已连接':'设备失联 / 未连接')+' · '+(p.mode||'UNKNOWN')+' · L'+(s.level??'—');el('health').dataset.level=String(s.level||0);el('stamp').textContent='最近更新 '+(s.updated_utc||'—')+'；状态年龄 '+(s.status_age_ms??'—')+' ms；特征年龄 '+(s.frame_age_ms??'—')+' ms';
el('cards').replaceChildren();for(let [k,x,unit] of [['实际转速',p.measured_rpm,'RPM'],['目标转速',p.requested_rpm,'RPM'],['实际 PWM',p.applied_pwm_counts==null?null:(p.applied_pwm_counts/40).toFixed(1),'%'],['器件温度',p.temp_raw_1_16_C==null?null:(p.temp_raw_1_16_C/16).toFixed(1),'℃'],[uncal?'电流（名义值，未标定）':'电流',fresh&&!(frame.quality&256)?v.current?.toFixed(3):null,'A'],[uncal?'差压（名义值，未标定）':'差压',fresh&&!(frame.quality&1024)?v.pressure?.toFixed(3):null,'kPa']]){let d=text('div','');d.className='card';d.append(text('div',k));let n=text('div',online?(x??'—')+' '+unit:'—');n.className='value';d.append(n);el('cards').append(d)}
el('details').replaceChildren(row('FPGA 原因',online?((p.active||[]).join('、')||'无'):'UNKNOWN'),row('锁存原因',online?((p.latched||[]).join('、')||'无'):'UNKNOWN'),row('风扇动作',online?p.fan_action:'UNKNOWN'),row('模型状态',online?(s.decision?.model_state||'UNAVAILABLE'):'UNAVAILABLE'),row('推理后端',s.model?.backend||'—'),row('模型观察',s.model?.label||'—'),row('特征帧',frame.frame_id),row('特征质量',(frame.quality_reasons||[]).join('、')||'—'),row('链路错误',s.error||'无'));
if(s.maintenance){const maintenance=s.maintenance;el('details').append(row('多工况基线',maintenance.condition_id||maintenance.state),row('预测状态',maintenance.state),row('阈值预计到达',maintenance.threshold_crossing_s==null?'—':maintenance.threshold_crossing_s.toFixed(1)+' 秒（非寿命）'),row('剩余寿命',maintenance.lifetime_qualified&&maintenance.remaining_life_s!=null?maintenance.remaining_life_s.toFixed(1)+' 秒':'未获得寿命标定，不提供数值'))}
el('events').replaceChildren();for(let e of events.slice(0,20)){let tr=document.createElement('tr');tr.append(text('td',e.code),text('td','L'+e.severity_current+' / '+e.state+'（峰值 L'+e.severity_peak+'）'),text('td',e.source+(e.maintenance_test_flag?'（测试）':'')));let td=text('td',e.acknowledged?'已确认':'');if(!e.acknowledged){let b=text('button','确认');b.onclick=async()=>{try{let r=await fetch('/api/ack',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({event_id:e.event_id})});if(!r.ok)throw Error('HTTP '+r.status);refresh()}catch(e){b.textContent='确认失败'}};td.append(b)}tr.append(td);el('events').append(tr)}
}catch(e){el('health').textContent='服务不可达 · 实时数值不可用';el('health').dataset.level='2';el('stamp').textContent='连接已失效；报警记录为历史记录';for(let n of el('cards').querySelectorAll('.value'))n.textContent='—';el('details').replaceChildren(row('设备状态','UNKNOWN'),row('模型状态','UNAVAILABLE'));for(let b of el('events').querySelectorAll('button'))b.disabled=true}finally{clearTimeout(timer);refreshing=false}}refresh();setInterval(refresh,1000);
</script></html>
