<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机柜 · 数据录制</title><style>
body{font:16px/1.6 system-ui,sans-serif;max-width:1000px;margin:30px auto;padding:0 18px;color:#283640;background:#f3f5f5}main{background:white;padding:24px;border:1px solid #cbd1d4}h1{font-size:25px}h2{font-size:19px}nav{display:flex;flex-wrap:wrap;gap:18px}a{color:#215b73}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:14px}input,select,textarea{font:inherit;box-sizing:border-box;width:100%;padding:8px;border:1px solid #aeb9bf;display:block}button{font:inherit;padding:9px 17px;margin:16px 8px 0 0;border:1px solid #819aa8;background:#eef2f3;color:#19465c}button:disabled{opacity:.4}.notice{border-left:3px solid #b98a36;padding-left:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#f1f3f4;padding:12px}#progress{font-size:21px}#message{white-space:pre-wrap;border-top:1px solid #ccd4d8;padding-top:16px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:18px}}
</style></head><body><main><nav><a href="/">运行状态</a><a href="/pressure-calibration">压差标定</a><a href="/history">历史</a></nav><h1>故障样本录制</h1>
<p class="notice">录制独立于NPU推理。先采集真实数据，再训练、审核模型。REAL需有效标定、39维帧及证据；DIAGNOSTIC只排查链路，不会自动变成训练数据。这里不改变PWM或保护。</p>
<div class="grid"><label>只读令牌<input id="read" type="password" autocomplete="off"></label><label>独立控制令牌<input id="control" type="password" autocomplete="off"></label></div><button id="connect">连接 / 读取录制状态</button><p id="progress">未连接</p>
<h2>本组工况</h2><div class="grid"><label>安装编号<input id="installation" maxlength="80" placeholder="例如 fan-A-duct-v1"></label><label>记录人<input id="operator" maxlength="80"></label><label>声明标签<select id="label"><option value="unlabelled">未标注</option><option value="normal">正常</option><option value="imbalance">失衡</option><option value="clog">堵塞</option><option value="stall">卡滞</option><option value="overheat">过热</option></select></label><label>持续秒数<input id="seconds" type="number" value="60" min="1" max="3600"></label><label>模式<select id="mode"><option value="REAL">REAL / 真实采样候选</option><option value="DIAGNOSTIC">DIAGNOSTIC / 仅诊断，不用于训练</option></select></label><label>实际位流SHA256<input id="bit" maxlength="64" placeholder="必须是核实后的位流SHA，不是BOOT SHA"></label><label>实际标定证据文件SHA256<input id="calibration" maxlength="64" placeholder="不是随意填写的64位字符串"></label></div><label>工况及安全备注<textarea id="note" maxlength="240" rows="2"></textarea></label>
<button id="start" disabled>开始本组录制</button><button id="stop" disabled>结束本组</button><button id="download" disabled>下载已落盘会话ZIP</button><p id="message" role="status">等待连接。一次录制对应一个UUID目录；下载保留原始帧、会话、合同和SHA摘要。</p><details><summary>状态与证据边界</summary><pre id="details">尚未读取</pre></details><p>时间到或点击结束后，须看到COMPLETED / DIAGNOSTIC_SAVED及持久帧数。ABORTED保留证据但不可当完整训练集。声明标签还需后续独立审核；一段连续录制不能冒充很多独立故障实验。</p></main>
<script>
'use strict';const field=id=>document.getElementById(id);let state=null,connected=false,busy=false,polling=false;
const identity=()=>crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,value=>(value^crypto.getRandomValues(new Uint8Array(1))[0]&15>>value/4).toString(16));
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',cache:'no-store',headers:{Authorization:'Bearer '+field('read').value,'X-Cabinet-Control-Token':field('control').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!response.ok){const result=await response.json();throw Error(result.reason||result.error||'请求失败');}return response;}
function render(value){state=value;field('progress').textContent=value.available?value.state+' · '+(value.elapsed_s||0)+' / '+(value.duration_s||0)+'秒 · 持久帧 '+(value.durable_frames||0)+' · 接受 '+(value.accepted||0)+' / 拒绝 '+(value.rejected||0):'录制未配置';field('details').textContent=JSON.stringify(value,null,2);field('start').disabled=busy||!value.available||value.state==='RECORDING'||(field('mode').value==='REAL'&&!value.ready);field('stop').disabled=busy||value.state!=='RECORDING';field('download').disabled=busy||!['COMPLETED','DIAGNOSTIC_SAVED','ABORTED'].includes(value.state)||!(value.durable_frames>0);}
async function refresh(){render(await (await api('/api/capture/status')).json());}
function handle(action){return async()=>{busy=true;try{await action();}catch(error){field('message').textContent=error.message+'；若网络中断，先核对状态，不要假定成功。';}finally{busy=false;if(state)render(state);}};}
field('connect').onclick=handle(async()=>{await refresh();connected=true;field('message').textContent=state.available?'已连接：'+state.ready_reason:state.reason;});field('mode').onchange=()=>{if(state)render(state);};
field('start').onclick=handle(async()=>{if(!state)throw Error('先读取状态');const real=field('mode').value==='REAL';for(const name of ['installation','operator','note'])if(!field(name).value.trim())throw Error('填写安装编号、记录人和工况备注');if(!field('seconds').checkValidity())throw Error('检查持续秒数');if(real&&(!/^[0-9a-f]{64}$/.test(field('bit').value)||!/^[0-9a-f]{64}$/.test(field('calibration').value)))throw Error('REAL需经核实的位流和标定证据SHA');const payload={expected_boot:state.boot,installation_id:field('installation').value.trim(),operator:field('operator').value.trim(),label:field('label').value,duration_s:Number(field('seconds').value),capture_mode:field('mode').value,bitstream_sha256:real?field('bit').value:null,calibration_evidence_sha256:real?field('calibration').value:null,note:field('note').value.trim()};const result=await (await api('/api/capture/start',{request_id:identity(),payload})).json();render(result.status);field('message').textContent='会话 '+state.session_id+' 已开始；尚未完成持久化验收。';});
field('stop').onclick=handle(async()=>{const result=await (await api('/api/capture/stop',{request_id:identity(),payload:{session_id:state.session_id}})).json();render(result.status);field('message').textContent='采集器回执：'+state.state+'，请核对持久帧数并下载。';});
field('download').onclick=handle(async()=>{const response=await api('/api/capture/download/'+state.session_id),blob=await response.blob();const url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='recording-'+state.session_id+'.zip';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);field('message').textContent='会话ZIP已交给浏览器下载；正式训练仍需标签和证据审核。';});
setInterval(async()=>{if(!connected||polling||busy)return;polling=true;try{await refresh();}catch(error){connected=false;state=null;field('progress').textContent='连接中断，不能确认录制状态';for(const name of ['start','stop','download'])field(name).disabled=true;field('message').textContent=error.message+'；恢复连接后核对服务器状态，勿假定录制成功。';}finally{polling=false;}},1000);
</script></body></html>
