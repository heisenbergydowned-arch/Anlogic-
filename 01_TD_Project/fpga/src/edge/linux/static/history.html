<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史与原始波形</title>
<style>body{font:16px system-ui;background:#101923;color:#e8eef5;max-width:1100px;margin:25px auto;padding:15px}a{color:#77d9cf}input,button,select{padding:8px;margin:5px;max-width:95%}canvas{background:#172635;width:100%;height:250px;border:1px solid #40576d}table{width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #40576d}.muted{color:#a4b7c9}#notice{white-space:pre-wrap}</style>
<style>td,#identity,#notice{overflow-wrap:anywhere}table{table-layout:fixed}input[type=range]{max-width:90%}</style>
<h1>历史查询与故障原始波形</h1><a href="/">返回实时监控</a><p class="muted">归档数据不代表设备当前状态。未标定、无效、测试和断连数据不补值；波形保持 A/B 独立时间戳。</p>
<label>开始 <input id="start" type="datetime-local"></label><label>结束 <input id="end" type="datetime-local"></label><button id="load">查询</button>
<label>授权令牌 <input id="token" type="password" autocomplete="off" placeholder="仅本页内存，不保存"></label><p id="notice" role="status">请选择时间范围</p>
<label>历史变量 <select id="metric"><option value="rpm">实际转速 RPM</option><option value="target_rpm">目标转速 RPM</option><option value="temperature">温度 ℃</option><option value="current">电流 A</option><option value="pressure">差压 kPa</option></select></label>
<canvas id="trend" width="1000" height="250"></canvas><p id="range"></p>
<h2>故障波形归档</h2><table><thead><tr><th>保存时间</th><th>启动会话 / 事件</th><th>操作</th></tr></thead><tbody id="records"></tbody></table>
<h2>原始 XYZ 回放</h2><label>测点 <select id="sensor"><option value="0">A</option><option value="1">B</option></select></label><button id="play">播放 / 暂停</button><input id="position" type="range" min="0" max="0" value="0"><button id="download">导出 CSV</button>
<canvas id="wave" width="1000" height="250"></canvas><p id="identity" class="muted">尚未选择波形；单位为 signed16 原始码，不冒充标定 g。</p>
<script>
const byId=id=>document.getElementById(id);let samples=[],waveform=null,position=0,playing=false,loading=false,selection=0;
async function request(url,format='json'){const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),5000);try{const token=byId('token').value;const response=await fetch(url,{cache:'no-store',signal:abort.signal,headers:token?{Authorization:'Bearer '+token}:{}});if(!response.ok)throw Error('HTTP '+response.status);return format==='json'?await response.json():await response.text()}finally{clearTimeout(timer)}}
function draw(id,series){const canvas=byId(id),width=Math.max(300,canvas.clientWidth),height=250,ratio=window.devicePixelRatio||1;canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);const context=canvas.getContext('2d');context.scale(ratio,ratio);context.clearRect(0,0,width,height);context.font='12px system-ui';const finite=series.flat().filter(point=>point&&Number.isFinite(point[0])&&Number.isFinite(point[1]));if(!finite.length){context.fillStyle='#a4b7c9';context.fillText('暂无有效数据',20,40);return}let xs=finite.map(point=>point[0]),ys=finite.map(point=>point[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);context.fillStyle='#a4b7c9';context.fillText('Y '+ymin.toFixed(3)+' … '+ymax.toFixed(3),10,20);context.fillText('X '+xmin.toFixed(3)+' … '+xmax.toFixed(3),10,38);series.forEach((points,index)=>{context.strokeStyle=['#55d9c8','#e9bb55','#eb869a'][index%3];context.beginPath();let connected=false;for(const point of points){if(!point||!Number.isFinite(point[1])){connected=false;continue}const horizontal=20+(point[0]-xmin)/Math.max(xmax-xmin,1e-12)*(width-40),vertical=230-(point[1]-ymin)/Math.max(ymax-ymin,1e-12)*175;if(connected)context.lineTo(horizontal,vertical);else context.moveTo(horizontal,vertical);connected=true}context.stroke()})}
function trend(){const metric=byId('metric').value;let previous=null;const points=[];for(const sample of samples){if(previous&&(sample.boot_id!==previous.boot_id||sample.recorded-previous.recorded>5||sample.recorded<previous.recorded))points.push(null);points.push(sample.valid&&sample.values[metric]!=null?[sample.recorded,sample.values[metric]]:null);previous=sample}draw('trend',[points])}
function showWave(){if(!waveform)return;const points=waveform.streams[Number(byId('sensor').value)],end=Math.min(Number(byId('position').value),points.length);draw('wave',[0,1,2].map(axis=>points.slice(0,end).flatMap(point=>point.quality?[null]:point.gap?[null,[point.time_ms,point.xyz[axis]]]:[[point.time_ms,point.xyz[axis]]])));byId('identity').textContent='SHA256 '+waveform.sha256+'；'+(waveform.test?'TEST 测试归档':'REAL 原始采集归档')+'；未授予诊断资格；独立时间戳 ms / 原始码；'+end+'/'+points.length+' 点'}
async function pages(kind,parameters){let rows=[],after=0;do{const page=await request('/api/history/'+kind+'?'+parameters+'&limit=500&after='+after);rows.push(...page.items);after=page.next_after;if(rows.length>=5000&&after){byId('notice').textContent='范围超过 5000 条，请缩小时间范围；当前为截断结果';break}}while(after!==null);return rows}
byId('load').onclick=async()=>{if(loading)return;loading=true;byId('load').disabled=true;try{const start=new Date(byId('start').value).getTime()/1000,end=new Date(byId('end').value).getTime()/1000;if(!Number.isFinite(start)||!Number.isFinite(end)||start>end)throw Error('请选择有效起止时间');byId('notice').textContent='正在读取归档…';samples=[];byId('records').replaceChildren();const params=new URLSearchParams({start,end});const results=await Promise.all([pages('samples',params),pages('waveforms',params)]);samples=results[0];trend();byId('range').textContent='历史样本 '+samples.length+'；无效/测试/未标定样本 '+samples.filter(sample=>!sample.valid).length;for(const item of results[1]){const row=document.createElement('tr');for(const value of [new Date(item.recorded*1000).toLocaleString(),item.boot_id+' / '+item.event_id]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}const cell=document.createElement('td'),button=document.createElement('button');button.textContent='查看原始波形';button.onclick=async()=>{const identity=++selection;playing=false;waveform=null;draw('wave',[]);try{const document=await request('/api/history/waveform?id='+encodeURIComponent(item.record_id));if(identity!==selection)return;waveform=document;byId('sensor').onchange();byId('notice').textContent='归档校验完成'}catch(error){byId('notice').textContent='回放不可用：'+error.message}};cell.append(button);row.append(cell);byId('records').append(row)}if(byId('notice').textContent==='正在读取归档…')byId('notice').textContent='查询完成；这是历史记录，不是设备当前状态'}catch(error){samples=[];trend();byId('records').replaceChildren();byId('notice').textContent='查询失败：'+error.message}finally{loading=false;byId('load').disabled=false}};
byId('metric').onchange=trend;byId('position').oninput=showWave;byId('sensor').onchange=()=>{if(!waveform)return;byId('position').max=waveform.streams[Number(byId('sensor').value)].length;byId('position').value=byId('position').max;showWave()};byId('play').onclick=()=>{if(!waveform)return;playing=!playing;if(playing&&Number(byId('position').value)>=Number(byId('position').max))byId('position').value=0};setInterval(()=>{if(playing&&waveform){byId('position').value=Math.min(Number(byId('position').value)+4,Number(byId('position').max));showWave();if(Number(byId('position').value)>=Number(byId('position').max))playing=false}},40);
byId('download').onclick=async()=>{if(!waveform)return;try{const content=await request('/api/history/waveform?id='+waveform.sha256+'&format=csv','text'),url=URL.createObjectURL(new Blob([content],{type:'text/csv'})),link=document.createElement('a');link.href=url;link.download='waveform-'+waveform.sha256+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(error){byId('notice').textContent='导出失败：'+error.message}};
window.addEventListener('resize',()=>{trend();showWave()});const localInput=date=>new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);byId('end').value=localInput(new Date());byId('start').value=localInput(new Date(Date.now()-3600000));
</script></html>
