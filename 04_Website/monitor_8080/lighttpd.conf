# ============================================================
#  cabinet-web · lighttpd 配置
#
#  静态文件：lighttpd 直接送（sendfile）
#  /api/*  ：mod_proxy 反代到常驻后端 apiserver.py（127.0.0.1:8081）
#
#  ★ 为什么不用 CGI：
#     CGI 每请求都要 fork + 启动解释器 + 导入模块，实测占 97% 的开销；
#     真正的业务逻辑只有 3%。换成常驻进程后每请求 CPU 从 ~60ms 降到 ~1ms。
# ============================================================

server.document-root = "/home/uisrc/web/public"
server.port          = 80
server.bind          = "0.0.0.0"

server.pid-file      = "/home/uisrc/web/logs/lighttpd.pid"
server.errorlog      = "/home/uisrc/web/logs/lighttpd.err.log"
server.breakagelog   = "/home/uisrc/web/logs/lighttpd.break.log"

server.modules = (
    "mod_proxy",
    "mod_setenv",
    "mod_access",
    "mod_accesslog"
)

# ---- 请求限制 ----
server.max-request-size    = 65536
server.max-keep-alive-idle = 10
server.max-read-idle       = 30
server.max-write-idle      = 30

# ---- 静态文件 ----
index-file.names = ( "index.html" )

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "application/javascript; charset=utf-8",
    ".json" => "application/json; charset=utf-8",
    ".svg"  => "image/svg+xml",
    ".png"  => "image/png",
    ".ico"  => "image/x-icon",
    ".txt"  => "text/plain; charset=utf-8"
)

# 静态目录里不允许出现可执行/敏感后缀
url.access-deny = ( "~", ".inc", ".py", ".sqlite3", ".db", ".sqlite3-wal", ".sqlite3-shm" )

# ---- API：反代到常驻后端 ----
# ↑ 这一行由 install.sh 按 lighttpd 版本替换：
#     >= 1.4.51 → proxy.forwarded = ( "for" => 1, "proto" => 1 )
#     <  1.4.51 → 留空。老版本没有任何机制把客户端 IP 透传给后端，
#                 审计日志的 actor 会记为 127.0.0.1（即 lighttpd 自己的地址）。
$HTTP["url"] =~ "^/api/" {
    proxy.server = ( "" => ( (
        "host" => "127.0.0.1",
        "port" => 8081
    ) ) )
        # lighttpd 1.4.45 < 1.4.51 : no way to pass client IP to backend.
    # audit actor will be recorded as 127.0.0.1 (the proxy address).
}

# ---- 访问日志 ----
accesslog.filename = "/home/uisrc/web/logs/lighttpd.access.log"
accesslog.format   = "%h %l %u %t \"%r\" %>s %b %D"

# ---- 安全响应头 ----
setenv.add-response-header = (
    "X-Content-Type-Options" => "nosniff",
    "X-Frame-Options"        => "SAMEORIGIN",
    "Referrer-Policy"        => "no-referrer"
)
